name: Frontend Service CICD

on:
  push:
    branches:
      - k8s_deploy
    paths:
      - "frontend/*"
      - ".github/workflows/frontend.yaml"

env:
      APP_NAME: "task-app-frontend"

jobs:
  checkout-and-image-build:
    name: checkout and image build
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # 3. Install dependencies
      - name: Dependencies Install
        working-directory: ./frontend
        run: |
          npm ci
      # 4. Build Frontend
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm run build
      # 5. Run Linting
      - name: Run Lint
        working-directory: ./frontend
        run: |
          npm run lint 
      # 6. Login To Docker Hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 7. GitHub SHA ko 7 characters mein convert karne ke liye
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT    
      # 8. Build Docker Image
      - name: 7. Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false  # Abhi push nahi karna hai
          load: true   # Local Docker daemon mein image save karein (taki scan aur push dono ho sakein)  
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ steps.vars.outputs.sha_short }}
      # 9. Image Scane       
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ steps.vars.outputs.sha_short }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'    
      # 10. Image Push To Docker Hub
      - name: Pushing Image To Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ steps.vars.outputs.sha_short }}

  deploy-to-kind:
    name: deploy to kind cluster
    runs-on: ubuntu-latest


    needs:
      - checkout-and-image-build

    steps:
      # - name: Set image variables
      #   id: vars
      #   run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Kind Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
           bash -lc '
              kubectl version --client
              echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
              echo "APP_NAME=${{ env.APP_NAME }}"
              echo "SHA_SHORT=${{ steps.vars.outputs.sha_short }}"
              # 1. Image update karein
              kubectl set image deployment/frontend-deployment frontend=${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.checkout-and-image-build.outputs.image_tag }} -n task-management
              
              # 2. Status verify karein (90 seconds tak wait karega)
              kubectl rollout status deployment/frontend-deployment -n task-management --timeout=30s
            '

